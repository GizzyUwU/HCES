services:
  hces:
    build:
      context: .
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: always
    ports:
      - "20261:8000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://localhost:8000/health | jq -e '.ok == true' >/dev/null",
        ]
      interval: 10s
      timeout: 2s
      retries: 5
      start_period: 10s

  hces_frontend:
    build:
      context: .
      dockerfile: Frontend.Dockerfile
    env_file: .env
    environment:
      - BACKEND_URL=http://hces:8000
    depends_on:
      hces:
        condition: service_healthy
    restart: always
    ports:
      - "5748:3000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -sS -D /tmp/headers -o /dev/null http://localhost:3000/ && grep -qi '^content-type:.*text/html' /tmp/headers",
        ]
      interval: 10s
      timeout: 2s
      retries: 5
      start_period: 4s
