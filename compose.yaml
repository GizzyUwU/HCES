services:
  hces:
    build:
      context: .
    env_file: .env
    environment:
      - SERVICE=backend
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: always
    ports:
      - "20261:8000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://localhost:8000/healthcheck | jq -e '.okay == true' >/dev/null",
        ]
      interval: 10s
      timeout: 2s
      retries: 5
      start_period: 4s

  frontend:
    build:
      context: .
    env_file: .env
    environment:
      - SERVICE=frontend
      - BACKEND_URL=http://hces:8000
    depends_on:
      backend:
        condition: service_healthy
    restart: always
    ports:
      - "5748:3000"